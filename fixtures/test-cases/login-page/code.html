<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 800px;
      position: relative;
    }
    .login-container {
      position: absolute;
      top: 120px;
      left: 240px;
      width: 320px;
    }
    .input-field {
      width: 300px;
      height: 40px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
      color: #111111;
      background-color: #ffffff;
      display: block;
    }
    .password-field {
      margin-top: 16px;
    }
    .submit-button {
      margin-top: 41px; /* Natural mismatch: 41px gap instead of 24px expected */
      width: 118px;
      height: 41px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <input type="email" class="input-field" placeholder="Email" />
    <input type="password" class="input-field password-field" placeholder="Password" />
    <button type="submit" class="submit-button">Sign in</button>
  </div>
</body>
</html>
